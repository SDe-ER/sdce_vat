name: Feature request
description: Propose a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What problem does this solve for Saudi VAT preparation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real taxpayer or financial data.
          required: true
